
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_estudiantes_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: estudiantes_db
      DB_USERNAME: laravel
      DB_PASSWORD: laravel123
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: api_estudiantes_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: estudiantes_db
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
